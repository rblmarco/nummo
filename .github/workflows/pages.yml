# Pubblica la cartella frontend/ su GitHub Pages a ogni push su main.
# Nessuna build: i file vengono pubblicati così come sono.
# Due job separati (prepara → pubblica), come raccomanda actions/deploy-pages:
# il job di pubblicazione parte solo quando l'artefatto "github-pages" è già registrato.
name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  prepara:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend

  pubblica:
    needs: prepara
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
